name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # ROS 2 Humble's Python
      - name: Cached radio maps
        uses: actions/cache@v4
        with:
          path: ~/.cache/wiloc
          key: radio-maps-${{ hashFiles('wiloc/**/*.py', 'wiloc/data/**') }}
          restore-keys: radio-maps-
      - name: Install
        run: pip install numpy scipy matplotlib pyyaml pytest
      - name: Unit tests (core library, no ROS needed)
        run: PYTHONPATH=. python -m pytest -q
