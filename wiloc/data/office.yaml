# WiLoc reference floor plan: a 20 m x 12 m office floor.
#
#   y=12 +---------+---------+---------+---------+
#        | Room A  | Room B  | Room C  | Room D  |   rooms 5 m x 5 m
#   y=7  +--D------+--D------+--D------+--D------+   D = 1 m door gap
#        |               corridor               |
#   y=5  +--D------+--D------+--D------+--D------+
#        | Room E  | Room F  | Room G  | Room H  |
#   y=0  +---------+---------+---------+---------+
#        x=0       5         10        15        20
#
# Wall losses (dB per crossing) follow the COST 231 multi-wall model.
name: office
width: 20.0
height: 12.0
wall_height: 2.5
wall_thickness: 0.15

# Radio environment (wiloc.radio.RadioConfig).  The Wi-Fi sensor and the
# localiser's survey both read this, so they always simulate the same world.
radio:
  seed: 7                   # shadowing field
  path_loss_exponent: 2.0
  shadowing_sigma_db: 5.0
  shadowing_corr_m: 3.0
  temporal_sigma_db: 3.0
  sensitivity_dbm: -95.0

materials:
  concrete: 12.0
  brick: 7.0
  drywall: 3.5
  glass: 2.0

walls:
  # exterior shell
  - {seg: [0, 0, 20, 0], material: concrete}
  - {seg: [20, 0, 20, 12], material: concrete}
  - {seg: [20, 12, 0, 12], material: concrete}
  - {seg: [0, 12, 0, 0], material: concrete}
  # corridor south wall (y = 5) with door gaps
  - {seg: [0, 5, 2, 5], material: brick}
  - {seg: [3, 5, 7, 5], material: brick}
  - {seg: [8, 5, 12, 5], material: brick}
  - {seg: [13, 5, 17, 5], material: brick}
  - {seg: [18, 5, 20, 5], material: brick}
  # corridor north wall (y = 7) with door gaps
  - {seg: [0, 7, 2, 7], material: brick}
  - {seg: [3, 7, 7, 7], material: brick}
  - {seg: [8, 7, 12, 7], material: brick}
  - {seg: [13, 7, 17, 7], material: brick}
  - {seg: [18, 7, 20, 7], material: brick}
  # room partitions
  - {seg: [5, 0, 5, 5], material: drywall}
  - {seg: [10, 0, 10, 5], material: concrete}   # structural core
  - {seg: [15, 0, 15, 5], material: drywall}
  - {seg: [5, 7, 5, 12], material: drywall}
  - {seg: [10, 7, 10, 12], material: glass}     # glass meeting-room wall
  - {seg: [15, 7, 15, 12], material: drywall}

access_points:
  - {id: AP1, x: 2.5, y: 10.8, tx_power: 20.0, channel: 1}
  - {id: AP2, x: 12.5, y: 10.0, tx_power: 20.0, channel: 6}
  - {id: AP3, x: 18.8, y: 8.5, tx_power: 20.0, channel: 11}
  - {id: AP4, x: 7.0, y: 1.2, tx_power: 20.0, channel: 1}
  - {id: AP5, x: 16.5, y: 1.8, tx_power: 20.0, channel: 6}
  - {id: AP6, x: 10.5, y: 6.0, tx_power: 17.0, channel: 11}

# Robot start pose (x, y, yaw) and a patrol route through doors.
start_pose: [1.0, 6.0, 0.0]
waypoints:
  - [2.5, 6.0]
  - [2.5, 9.5]
  - [3.8, 10.5]
  - [2.5, 9.5]
  - [2.5, 6.0]
  - [7.5, 6.0]
  - [7.5, 2.5]
  - [8.5, 1.5]
  - [7.5, 2.5]
  - [7.5, 6.0]
  - [12.5, 6.0]
  - [12.5, 9.5]
  - [11.2, 10.8]
  - [12.5, 9.5]
  - [12.5, 6.0]
  - [17.5, 6.0]
  - [17.5, 2.5]
  - [16.5, 3.5]
  - [17.5, 2.5]
  - [17.5, 6.0]
  - [19.0, 6.0]
  - [10.0, 6.0]
  - [1.5, 6.0]

# Named rooms (captions: "Not sure: Meeting room (55 %) or Corridor (35 %)").
rooms:
  - {name: Office A, rect: [0, 7, 5, 12]}
  - {name: Office B, rect: [5, 7, 10, 12]}
  - {name: Meeting room, rect: [10, 7, 15, 12]}
  - {name: Lounge, rect: [15, 7, 20, 12]}
  - {name: Office E, rect: [0, 0, 5, 5]}
  - {name: Print room, rect: [5, 0, 10, 5]}
  - {name: Office G, rect: [10, 0, 15, 5]}
  - {name: Kitchen, rect: [15, 0, 20, 5]}
  - {name: Corridor, rect: [0, 5, 20, 7]}

# Furniture: the robot drives around it (path planning); radio and the
# particle filter ignore it.  rect: [x0, y0, x1, y1], or at: [x, y] with the
# type's default footprint (rotate: true turns it by 90 degrees).
furniture:
  # Office A
  - {type: desk, rect: [0.15, 8.2, 0.85, 9.8]}
  - {type: chair, at: [1.2, 9.0], back: e}
  - {type: bookshelf, rect: [3.0, 11.5, 4.6, 11.85]}
  - {type: plant, at: [0.45, 11.5]}
  # Office B
  - {type: desk, rect: [5.2, 11.1, 6.8, 11.8]}
  - {type: chair, at: [6.0, 10.7], back: s}
  - {type: desk, rect: [7.3, 11.1, 8.9, 11.8]}
  - {type: chair, at: [8.1, 10.7], back: s}
  - {type: cabinet, at: [9.5, 7.6], rotate: true}
  # Meeting room (glass wall)
  - {type: meeting_table, rect: [13.1, 8.4, 14.6, 9.4]}
  - {type: chair, at: [13.5, 8.1], back: s}
  - {type: chair, at: [14.2, 8.1], back: s}
  - {type: chair, at: [13.5, 9.7], back: n}
  - {type: chair, at: [14.2, 9.7], back: n}
  - {type: plant, at: [10.5, 11.5]}
  # Lounge
  - {type: sofa, rect: [16.0, 11.1, 18.2, 11.85], back: n}
  - {type: coffee_table, at: [17.1, 10.3]}
  - {type: chair, at: [15.6, 10.3], back: w}
  - {type: plant, at: [19.5, 11.5]}
  # Office E
  - {type: desk, rect: [0.6, 0.15, 2.2, 0.85]}
  - {type: chair, at: [1.4, 1.2], back: n}
  - {type: desk, rect: [2.8, 0.15, 4.4, 0.85]}
  - {type: chair, at: [3.6, 1.2], back: n}
  - {type: bookshelf, rect: [0.15, 2.6, 0.5, 4.2]}
  # Print room
  - {type: bookshelf, rect: [5.15, 0.6, 5.5, 3.6]}
  - {type: cabinet, rect: [9.4, 3.4, 9.85, 4.6]}
  - {type: table, rect: [5.8, 4.0, 7.0, 4.6]}
  # Office G
  - {type: desk, rect: [13.2, 0.15, 14.8, 0.85]}
  - {type: chair, at: [14.0, 1.2], back: n}
  - {type: bookshelf, rect: [10.15, 1.0, 10.5, 2.6]}
  - {type: plant, at: [14.5, 4.4]}
  # Kitchen
  - {type: counter, rect: [19.2, 0.3, 19.85, 2.8]}
  - {type: fridge, rect: [19.2, 3.0, 19.85, 3.7]}
  - {type: table, rect: [15.6, 0.5, 16.6, 1.5]}
  # Corridor
  - {type: plant, at: [0.4, 5.4]}
  - {type: plant, at: [19.6, 6.6]}

# Where "Kidnap" drops the robot: one spot per room, clear of furniture.
kidnap_spots:
  - [1.5, 3.5]
  - [8.5, 1.5]
  - [12.0, 3.0]
  - [18.5, 1.2]
  - [1.2, 10.8]
  - [7.0, 9.0]
  - [13.5, 10.8]
  - [18.0, 9.0]
